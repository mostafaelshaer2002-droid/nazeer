name: update-fires

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fires
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python fetch_fires.py
      - name: Commit data
        run: |
          git config user.name "nazeer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/fires.json
          git diff --cached --quiet || git commit -m "update fires data"
          git push
